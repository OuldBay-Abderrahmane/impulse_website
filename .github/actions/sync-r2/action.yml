name: Sync Cloudflare R2 media
description: Upload media before publishing and expose its public origin to the site build.

inputs:
  account-id:
    description: Cloudflare account ID.
    required: false
  access-key-id:
    description: R2 API access key ID.
    required: false
  secret-access-key:
    description: R2 API secret access key.
    required: false
  bucket:
    description: R2 bucket name.
    required: false
  public-base-url:
    description: Public HTTPS origin for the R2 bucket.
    required: false

outputs:
  public-base-url:
    description: Public media origin, or an empty string when R2 is not configured.
    value: ${{ steps.configure.outputs.public-base-url }}

runs:
  using: composite
  steps:
    - name: Check R2 configuration
      id: configure
      shell: bash
      env:
        R2_ACCOUNT_ID: ${{ inputs.account-id }}
        R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        R2_BUCKET: ${{ inputs.bucket }}
        R2_PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
      run: |
        set -euo pipefail
        configured=0
        missing=()
        for setting in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
          if [[ -n "${!setting}" ]]; then
            configured=$((configured + 1))
          else
            missing+=("${setting}")
          fi
        done

        if [[ "${configured}" -eq 0 ]]; then
          echo "R2 is not configured; publishing with local media."
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "public-base-url=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ "${#missing[@]}" -gt 0 ]]; then
          echo "::error::Incomplete R2 configuration. Missing: ${missing[*]}"
          exit 1
        fi

        node --input-type=module <<'NODE'
        import { appendFileSync } from "node:fs";
        const value = process.env.R2_PUBLIC_BASE_URL.trim();
        const url = new URL(value);
        if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/") {
          throw new Error("R2_PUBLIC_BASE_URL must be a public HTTPS origin, such as https://assets.impulsepodcast.com.");
        }
        appendFileSync(process.env.GITHUB_OUTPUT, `enabled=true\npublic-base-url=${url.origin}\n`);
        NODE

    - name: Upload media to Cloudflare R2
      if: steps.configure.outputs.enabled == 'true'
      shell: bash
      env:
        R2_ACCOUNT_ID: ${{ inputs.account-id }}
        R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        R2_BUCKET: ${{ inputs.bucket }}
        R2_PUBLIC_BASE_URL: ${{ steps.configure.outputs.public-base-url }}
      run: npm run r2:push -- --apply
